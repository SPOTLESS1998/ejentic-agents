name: Job Agent

# Runs the job/lead hunter on a schedule and lets you trigger it by hand.
on:
  schedule:
    # Daily at 06:17 UTC (~07:17 in Nigeria/WAT). Odd minute chosen on purpose
    # so we're not hitting the APIs at the top of the hour with everyone else.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

# Needed so the run can commit the updated "seen" list back to the repo.
permissions:
  contents: write

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The profile files are gitignored (real name/email/phone), so they never
      # reach GitHub. Their contents come from repo secrets instead; this step
      # writes them to disk for this run only, and fails fast — before npm ci —
      # if either secret is missing.
      - name: Materialize profile files from secrets
        env:
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
          COMPANY_PROFILE_JSON: ${{ secrets.COMPANY_PROFILE_JSON }}
        run: |
          if [ -z "$CANDIDATE_PROFILE_JSON" ] || [ -z "$COMPANY_PROFILE_JSON" ]; then
            echo "::error::Missing repo secrets CANDIDATE_PROFILE_JSON / COMPANY_PROFILE_JSON."
            echo "  Add them (Settings → Secrets and variables → Actions) with:"
            echo "    gh secret set CANDIDATE_PROFILE_JSON < profile/candidate.json"
            echo "    gh secret set COMPANY_PROFILE_JSON   < profile/company.json"
            echo "  Those files are gitignored, so CI has no other way to see them."
            exit 1
          fi
          mkdir -p profile
          printf '%s' "$CANDIDATE_PROFILE_JSON" > profile/candidate.json
          printf '%s' "$COMPANY_PROFILE_JSON"   > profile/company.json

      - run: npm ci

      - name: Run job agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run job

      # Persist the "already reported" memory so tomorrow's run won't repeat itself,
      # AND the run log so the fleet has a history.
      #
      # The run log was added to this step on 2026-10-16, and it was not a
      # formality: src/lib/runlog.ts writes data/run-log.jsonl + data/AGENT-LOG.md
      # on every run, but this step only ever committed the seen file — so both
      # were written on the runner and thrown away when the job ended. The log
      # existed in the source and nowhere in reality, which is worse than not
      # having it: the health table looked like an oversight rather than a lie.
      - name: Save job state and run log
        if: always()
        run: |
          # git diff --quiet misses UNTRACKED files (e.g. the very first run,
          # before these files exist in the repo) — use git status instead,
          # which catches both new and modified files.
          FILES="data/seen-jobs.json data/run-log.jsonl data/AGENT-LOG.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No change to the job state."
            exit 0
          fi
          git config user.name "ejentic-bot"
          git config user.email "bot@users.noreply.github.com"
          # The run log is append-only and SHARED by all five agents, so two runs
          # finishing within the same second used to conflict here and fail the
          # whole save, losing the run entry. On 2026-10-16 that is exactly what
          # happened to a scholarship run and a hackathon run. The log now merges
          # by union (.gitattributes) and the index is rebuilt below.
          git config merge.ours.driver true
          git add $FILES
          git commit -m "chore: update job agent state [skip ci]"
          # Another agent may commit to main while this run is working. Retry the
          # rebase+push instead of failing the state save.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              # The log may have unioned another agent's lines in. The index is a
              # RENDERING of the log, so rebuild it — otherwise the table a human
              # reads goes stale and omits runs, which is the exact failure the
              # log exists to prevent.
              npm run regen-log
              git add data/AGENT-LOG.md
              git diff --cached --quiet || git commit --amend --no-edit
              if git push; then
                echo "State saved (attempt $attempt)."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Save attempt $attempt lost the race; retrying…"
            sleep $((attempt * 3))
          done
          echo "::error::Could not save state after 5 attempts — this run's log entry may be lost."
          exit 1
