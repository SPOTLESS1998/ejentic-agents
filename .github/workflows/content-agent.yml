name: Content Creator Agent

# The Ejentic content studio: three runs a day (Nigeria / WAT = UTC+1):
#   morning   09:03 WAT  → educational & thought leadership (the "Why")
#   afternoon 14:03 WAT  → technical showcase & offers      (the "What")
#   evening   19:03 WAT  → vision, culture & impact         (the "Who")
# Each run drafts one topic as TWO platform variations (X + LinkedIn) and drops
# them on the dedicated content bot in Telegram for human review. Fully
# autonomous: the repo is the memory, Actions is the engine — no Claude/Cline
# needed on any day. You can also trigger a run by hand (workflow_dispatch).
on:
  schedule:
    - cron: '3 8 * * *'
    - cron: '3 13 * * *'
    - cron: '3 18 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Force a calendar day (1-30). Leave empty for automatic.'
        required: false
        default: ''
      slot:
        description: 'Force a slot (morning/afternoon/evening). Leave empty for automatic.'
        required: false
        default: ''

# Needed so the run can commit the updated "seen" list back to the repo.
permissions:
  contents: write

concurrency:
  group: content-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The profile files are gitignored (real name/email/phone), so they never
      # reach GitHub. Their contents come from repo secrets instead; this step
      # writes them to disk for this run only, and fails fast — before npm ci —
      # if either secret is missing.
      - name: Materialize profile files from secrets
        env:
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
          COMPANY_PROFILE_JSON: ${{ secrets.COMPANY_PROFILE_JSON }}
        run: |
          if [ -z "$CANDIDATE_PROFILE_JSON" ] || [ -z "$COMPANY_PROFILE_JSON" ]; then
            echo "::error::Missing repo secrets CANDIDATE_PROFILE_JSON / COMPANY_PROFILE_JSON."
            echo "  Add them (Settings → Secrets and variables → Actions) with:"
            echo "    gh secret set CANDIDATE_PROFILE_JSON < profile/candidate.json"
            echo "    gh secret set COMPANY_PROFILE_JSON   < profile/company.json"
            echo "  Those files are gitignored, so CI has no other way to see them."
            exit 1
          fi
          mkdir -p profile
          printf '%s' "$CANDIDATE_PROFILE_JSON" > profile/candidate.json
          printf '%s' "$COMPANY_PROFILE_JSON"   > profile/company.json

      - run: npm ci

      # Which of the three daily crons fired? Pass the slot EXPLICITLY so the run
      # never has to guess it from the wall clock (the old guess put the 13:03
      # afternoon cron in the "morning" band, so it was skipped as a duplicate).
      - name: Resolve slot from the cron trigger
        id: trig
        run: |
          case "${{ github.event.schedule }}" in
            "3 8 * * *")  echo "slot=morning"   >> "$GITHUB_OUTPUT" ;;
            "3 13 * * *") echo "slot=afternoon" >> "$GITHUB_OUTPUT" ;;
            "3 18 * * *") echo "slot=evening"   >> "$GITHUB_OUTPUT" ;;
            *)            echo "slot="          >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run content creator agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # Dedicated content bot (falls back to the main bot if unset).
          TELEGRAM_CONTENT_BOT_TOKEN: ${{ secrets.TELEGRAM_CONTENT_BOT_TOKEN }}
          TELEGRAM_CONTENT_CHAT_ID: ${{ secrets.TELEGRAM_CONTENT_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Optional tuning (repo variables, all have safe defaults):
          RESEARCH_LOOKBACK_DAYS: ${{ vars.RESEARCH_LOOKBACK_DAYS }}
          RESEARCH_PER_RUN: ${{ vars.RESEARCH_PER_RUN }}
          CONSULTATION_URL: ${{ vars.CONSULTATION_URL }}
          CONTENT_CYCLE_START: ${{ vars.CONTENT_CYCLE_START }}
          # Optional stronger model JUST for drafting (unset → shared default).
          CONTENT_MODEL: ${{ vars.CONTENT_MODEL }}
          # The editor rewrites a draft once if it scores below this (default 8/10).
          CONTENT_QUALITY_GATE: ${{ vars.CONTENT_QUALITY_GATE }}
          # Ceiling on Gemini calls per run (default 4 = full editor pass). Turn it
          # down to 3 or 2 if the free daily quota gets tight — see the README.
          CONTENT_MAX_AI_CALLS: ${{ vars.CONTENT_MAX_AI_CALLS }}
        run: npm run content -- ${{ github.event.inputs.day && format('--day={0}', github.event.inputs.day) || '' }} ${{ github.event.inputs.slot && format('--slot={0}', github.event.inputs.slot) || (steps.trig.outputs.slot && format('--slot={0}', steps.trig.outputs.slot)) || '' }}

      # Persist the "already delivered" memory AND the durable post log so a
      # repeated run won't resend and the weekly newsletter has its source data.
      # The run log is included here for the same reason as every other agent —
      # see job-agent.yml: it was being written on the runner and thrown away.
      - name: Save content state and run log
        if: always()
        run: |
          # git diff --quiet misses UNTRACKED files (e.g. the very first run,
          # before these files exist in the repo) — use git status instead,
          # which catches both new and modified files.
          FILES="data/seen-content.json data/content-posts.json data/run-log.jsonl data/AGENT-LOG.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No change to the content state."
            exit 0
          fi
          git config user.name "ejentic-bot"
          git config user.email "bot@users.noreply.github.com"
          # The run log is append-only and SHARED by all five agents, so two runs
          # finishing within the same second used to conflict here and fail the
          # whole save, losing the run entry. On 2026-10-16 that is exactly what
          # happened to a scholarship run and a hackathon run. The log now merges
          # by union (.gitattributes) and the index is rebuilt below.
          git config merge.ours.driver true
          git add $FILES
          git commit -m "chore: update content agent state [skip ci]"
          # Another agent may commit to main while this run is working. Retry the
          # rebase+push instead of failing the state save.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              # The log may have unioned another agent's lines in. The index is a
              # RENDERING of the log, so rebuild it — otherwise the table a human
              # reads goes stale and omits runs, which is the exact failure the
              # log exists to prevent.
              npm run regen-log
              git add data/AGENT-LOG.md
              git diff --cached --quiet || git commit --amend --no-edit
              if git push; then
                echo "State saved (attempt $attempt)."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Save attempt $attempt lost the race; retrying…"
            sleep $((attempt * 3))
          done
          echo "::error::Could not save state after 5 attempts — this run's log entry may be lost."
          exit 1
          fi