name: Hackathon Agent

# Runs the hackathon hunter on a schedule and lets you trigger it by hand.
on:
  schedule:
    # Daily at 07:17 UTC — 20 min after the Researcher agent (06:57) and well
    # before the Content agent's morning run (08:03), keeping the staggered
    # "separate, digestible briefings" pattern.
    - cron: '17 7 * * *'
  workflow_dispatch: {}

# Needed so the run can commit the updated "seen" list back to the repo.
permissions:
  contents: write

concurrency:
  group: hackathon-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run hackathon agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_HACKATHONS: ${{ vars.MAX_HACKATHONS }}
        run: npm run hackathon

      # Persist the "already reported" memory so tomorrow's run won't repeat itself.
      - name: Save seen list
        if: always()
        run: |
          # git diff --quiet misses UNTRACKED files (e.g. the very first run,
          # before this file exists in the repo) — use git status instead,
          # which catches both new and modified files.
          if [ -n "$(git status --porcelain -- data/seen-hackathons.json)" ]; then
            git config user.name "ejentic-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/seen-hackathons.json
            git commit -m "chore: update hackathon agent seen list [skip ci]"
            git push
          else
            echo "No change to the seen list."
          fi
