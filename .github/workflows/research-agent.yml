name: Researcher Agent

# Runs the Ejentic researcher on a schedule and lets you trigger it by hand.
on:
  schedule:
    # Daily at 06:57 UTC — 40 min after the Job agent, staggered so the three
    # agents' runs (and their Telegram messages) don't collide.
    - cron: '57 6 * * *'
  workflow_dispatch: {}

# Needed so the run can commit the updated "seen" list back to the repo.
permissions:
  contents: write

concurrency:
  group: research-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run researcher agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run research

      # Persist the "already reported" memory so tomorrow's run won't repeat itself.
      - name: Save seen list
        if: always()
        run: |
          if ! git diff --quiet -- data/seen-research.json; then
            git config user.name "ejentic-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/seen-research.json
            git commit -m "chore: update researcher agent seen list [skip ci]"
            git push
          else
            echo "No change to the seen list."
          fi
